<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACTS</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* RESET GLOBALE */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: 'Titillium Web', sans-serif; /* Font Titillium Web */
    background-color: #fff9e6; 
    color: #111;
  }

  /* BODY VERTICALE */
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* HEADER LOGO A SINISTRA */
  header {
    display: flex;
    align-items: center;
    padding: 20px;
    flex-shrink: 0;
  }

  .logo-link img {
    height: 100px;
    width: auto;
    display: block;
  }

  /* SEZIONE DEMO POLICY */
  #demo-policy {
    max-width: 800px;
    width: 100%;
    padding: 20px;
    margin: -80px auto 0 auto; /* ← QUI È LA CHIAVE */
    text-align: center;
    line-height: 1.6;
    background-color: #fff9e6; 
  }

  /* TITOLI E TESTO */
  #demo-policy h2, #demo-policy h3 {
    font-weight: 700;
    margin-bottom: 10px;
    margin-top: 20px;
  }

  #demo-policy p {
    margin-bottom: 10px;
  }

  #demo-policy ul {
    list-style-position: inside;
    margin: 10px 0 20px 0;
    padding-left: 20px;
  }

  #demo-policy a {
    color: #111;
    text-decoration: none;
    font-weight: 700;
  }

  #demo-policy a:hover {
    text-decoration: underline;
  }
  footer {
  text-align: center;          /* testo e pulsanti centrati */
  padding: 25px 20px;
  font-size: 0.9rem;
  color: #111;                 /* colore testo */
  border-top: 1px solid #eee;
  background-color: #fff9e6;   /* bianco caldo */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;                   /* spazio tra copyright e pulsanti */
}

footer .social-buttons {
  display: flex;
  gap: 15px;                   /* spazio tra le icone */
}

footer .social-buttons a {
  color: #111;                 /* icone nere */
  font-size: 24px;             /* dimensione icone */
  transition: transform 0.3s ease, color 0.3s ease;
}

footer .social-buttons a:hover {
  color: #555;                 /* leggero scurimento al passaggio del mouse */
  transform: translateY(-2px); /* effetto sollevamento */
}
</style>
</head>
<body>

<!-- HEADER LOGO A SINISTRA -->
<header>
  <a href="index.html" class="logo-link">
    <img src="images/logo2.png" alt="[Your Label Name] Logo">
  </a>
</header>

<!-- SEZIONE DEMO POLICY -->
<section id="demo-policy">
  <h2>CONTACTS</h2>

    mail: prova@mraxanilabel.it</p>
    <p>youtubechannel: fairgaoirg.youtube</p>
   <p> instagram: srgjargiajrg</p>



  
</section>
<footer>
  &copy; 2026 Mraxani Label
  <div class="social-buttons">
    <a href="https://www.instagram.com/tuoaccount" target="_blank" title="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.youtube.com/tuocanale" target="_blank" title="YouTube">
      <i class="fab fa-youtube"></i>
    </a>
    <a href="https://open.spotify.com/artist/tuoartista" target="_blank" title="Spotify">
      <i class="fab fa-spotify"></i>
    </a>
  </div>
</footer>
</body>
</html>
