<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACTS</title>

<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* LAYOUT BASE */
body {
  font-family: 'Titillium Web', sans-serif;
  background-color: #fff9e6;
  color: #111;

  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
}

/* LOGO */
.logo img {
  height: 100px;
}
  /* FOOTER */
footer {
  text-align: center;          /* testo e pulsanti centrati */
  padding: 25px 20px;
  font-size: 0.9rem;
  color: #111;                 /* colore testo */
  border-top: 1px solid #eee;
  background-color: #fff9e6;   /* bianco caldo */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;                   /* spazio tra copyright e pulsanti */
}

footer .social-buttons {
  display: flex;
  gap: 15px;                   /* spazio tra le icone */
}

footer .social-buttons a {
  color: #111;                 /* icone nere */
  font-size: 24px;             /* dimensione icone */
  transition: transform 0.3s ease, color 0.3s ease;
}

footer .social-buttons a:hover {
  color: #555;                 /* leggero scurimento al passaggio del mouse */
  transform: translateY(-2px); /* effetto sollevamento */
}

/* CONTENUTO CENTRALE */
main {
  flex: 1; /* 🔑 spinge il footer in basso */
}

</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img src="images/logo2.png" alt="Mraxani Label">
  </a>
</header>

<main>
  <section id="contacts" style="text-align:center; padding:60px 20px;">
    <h2>Contatti</h2>
    <p>Email: info@mraxanilabel.it</p>
    <p>Instagram: @tuoaccount</p>
    <p>YouTube: tuo canale</p>
        </a>
      </div>

    </div>
  </section>
</main>

<footer>
  &copy; 2026 Mraxani Label
  <div class="social-buttons">
    <a href="https://www.instagram.com/tuoaccount" target="_blank" title="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.youtube.com/tuocanale" target="_blank" title="YouTube">
      <i class="fab fa-youtube"></i>
    </a>
    <a href="https://open.spotify.com/artist/tuoartista" target="_blank" title="Spotify">
      <i class="fab fa-spotify"></i>
    </a>
  </div>
</footer>

</body>
</html>
