<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etichetta Discografica</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Titillium Web', sans-serif;
  background-color: #fdfcf7;
  color: #111;
}

<header class="top-bar">
  <a href="index.html" class="logo">
    <img src="images/logo2.png" alt="Logo">
  </a>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="#mission">Mission</a>
    <a href="artists.html">Artists</a>
    <a href="demos.html">Demos</a>
    <a href="#contacts">Contacts</a>
  </nav>

  <div class="social-icons">
    <a href="#">IG</a>
    <a href="#">YT</a>
    <a href="#">SP</a>
  </div>
</header>

/* LOGO */
.logo img {
  height: 100px;
}

/* NAV */
.main-nav {
  display: flex;
  gap: 25px;
}

.main-nav a {
  text-decoration: none;
  color: #111;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.95rem;
}

.main-nav a:hover {
  color: #555;
}

/* SOCIAL ICONS */
.social-icons {
  display: flex;
  gap: 14px;
}

.social-icons svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: #111;
  stroke-width: 2;
}

.social-icons a:hover svg {
  stroke: #555;
}

/* RELEASES */
.grid-releases {
  max-width: 1000px;
  margin: 230px auto 40px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 30px;
}

.album {
  text-align: center;
}

.album-image {
  position: relative;
  width: 360px;
  height: 360px;
  margin: 0 auto;
}

.album-image img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  transition: opacity 0.3s ease;
}

.album-image img.back {
  opacity: 0;
}

.album-image:hover img.front {
  opacity: 0;
}

.album-image:hover img.back {
  opacity: 1;
}

/* INFO */
.album-info {
  margin-top: 12px;
}

.album-info p {
  font-size: 0.9rem;
  margin: 4px 0;
}

/* PAYPAL */
.paypal-button {
  margin-top: 10px;
}

/* FOOTER */
footer {
  margin-top: 50px;
  padding: 25px 0;
  text-align: center;
  font-size: 0.9rem;
  color: #777;
  border-top: 1px solid #eee;
}
</style>
</head>

<body>

<header class="site-header">

  <!-- LOGO -->
  <a href="index.html" class="logo">
    <img src="images/logo2.png" alt="Logo">
  </a>

  <!-- NAV -->
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="#mission">Mission</a>
    <a href="artists.html">Artists</a>
    <a href="demos.html">Demos</a>
    <a href="#contacts">Contacts</a>
  </nav>

  <!-- SOCIAL -->
  <div class="social-icons">
    <a href="#" aria-label="Instagram">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1.2"/>
      </svg>
    </a>

    <a href="#" aria-label="YouTube">
      <svg viewBox="0 0 24 24">
        <path d="M23 12s0-4-1-5-5-1-10-1-9 0-10 1-1 5-1 5 0 4 1 5 5 1 10 1 9 0 10-1 1-5 1-5z"/>
        <polygon points="10,8 16,12 10,16"/>
      </svg>
    </a>

    <a href="#" aria-label="Spotify">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M7 10c4-1 8 0 10 1"/>
        <path d="M7.5 13c3-.5 6 .2 8 1"/>
        <path d="M8 16c2-.3 4 .2 6 .8"/>
      </svg>
    </a>
  </div>

</header>

<!-- RELEASES -->
<section class="grid-releases">

  <div class="album">
    <div class="album-image">
      <img class="front" src="images/discomatadiau.png">
      <img class="back" src="images/discomatadiauback.png">
    </div>
    <div class="album-info">
      <p>Artista 1</p>
      <p>Disco 1</p>
      <div class="paypal-button" id="paypal-button-container-1"></div>
    </div>
  </div>

  <div class="album">
    <div class="album-image">
      <img class="front" src="images/disco2.png">
      <img class="back" src="images/disco2back.png">
    </div>
    <div class="album-info">
      <p>Artista 2</p>
      <p>Disco 2</p>
      <div class="paypal-button" id="paypal-button-container-2"></div>
    </div>
  </div>

</section>

<footer>
  &copy; 2025 Mraxani Label
</footer>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=IL_TUO_CLIENT_ID&currency=EUR"></script>
<script>
paypal.Buttons({}).render('#paypal-button-container-1');
paypal.Buttons({}).render('#paypal-button-container-2');
</script>

</body>
</html>
