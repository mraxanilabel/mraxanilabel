<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mraxani Label – Artists</title>

<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* LAYOUT BASE */
body {
  font-family: 'Titillium Web', sans-serif;
  background-color: #fff9e6;
  color: #111;

  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
}

/* LOGO IN ALTO A SINISTRA */
.logo {
  position: absolute;
  top: 10px;
  left: 10px;
}

.logo img {
  height: 60px;
  width: auto;
  display: block;
}
/* CONTENUTO CENTRALE */
main {
  flex: 1; /* 🔑 spinge il footer in basso */
}

/* SEZIONE ARTISTI */
#artists {
  display: flex;
  justify-content: center;
  margin-top: 60px;
}

/* GRID */
.grid-artists {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1100px;
  width: 100%;
  padding: 20px 20px;
}

/* CARD ARTISTA */
.artist-card {
  position: relative;
  overflow: hidden;
}

.artist-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

.artist-card:hover img {
  transform: scale(1.05);
}

/* OVERLAY NOME ARTISTA */
.artist-name {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px 0;
  background: rgba(0,0,0,0.6);
  color: #fff;
  text-align: center;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* HOVER */
.artist-card:hover .artist-name {
  opacity: 1;
}

/* LINK */
.artist-card a {
  display: block;
  color: inherit;
  text-decoration: none;
}

/* FOOTER */
footer {
  text-align: center;          /* testo e pulsanti centrati */
  padding: 25px 20px;
  font-size: 0.9rem;
  color: #111;                 /* colore testo */
  border-top: 1px solid #eee;
  background-color: #fff9e6;   /* bianco caldo */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;                   /* spazio tra copyright e pulsanti */
}

footer .social-buttons {
  display: flex;
  gap: 15px;                   /* spazio tra le icone */
}

footer .social-buttons a {
  color: #111;                 /* icone nere */
  font-size: 24px;             /* dimensione icone */
  transition: transform 0.3s ease, color 0.3s ease;
}

footer .social-buttons a:hover {
  color: #555;                 /* leggero scurimento al passaggio del mouse */
  transform: translateY(-2px); /* effetto sollevamento */
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img src="images/logo2.png" alt="Mraxani Label">
  </a>
</header>

<main>
  <section id="artists">
    <div class="grid-artists">

      <div class="artist-card">
        <a href="claudiomelis.html">
          <img src="images/claudiomelis.png" alt="Claudio Melis">
          <div class="artist-name">Claudio Melis</div>
        </a>
      </div>

      <div class="artist-card">
        <a href="eliacasu.html">
          <img src="images/eliacasu.png" alt="Elia Casu">
          <div class="artist-name">Elia Casu</div>
        </a>
      </div>

      <div class="artist-card">
        <a href="antoniopinna.html">
          <img src="images/antoniopinna.png" alt="Antonio Pinna">
          <div class="artist-name">Antonio Pinna</div>
        </a>
      </div>
          <div class="artist-card">
        <a href="lauramura.html">
          <img src="images/lauramura.png" alt="Laura Mura">
          <div class="artist-name">Laura Mura</div>
        </a>
      </div>
          <div class="artist-card">
        <a href="simonesoro.html">
          <img src="images/simonesoro.png" alt="Simone Soro">
          <div class="artist-name">Simone Soro</div>
        </a>
      </div>
          <div class="artist-card">
        <a href="fabiocoronas.html">
          <img src="images/fabiocoronas.png" alt="Fabio Coronas">
          <div class="artist-name">Fabio Coronas</div>
        </a>
      </div>

    </div>
  </section>
</main>

<footer>
  &copy; 2026 Mraxani Label
  <div class="social-buttons">
    <a href="https://www.instagram.com/tuoaccount" target="_blank" title="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.youtube.com/tuocanale" target="_blank" title="YouTube">
      <i class="fab fa-youtube"></i>
    </a>
    <a href="https://open.spotify.com/artist/tuoartista" target="_blank" title="Spotify">
      <i class="fab fa-spotify"></i>
    </a>
  </div>
</footer>

</body>
</html>
