<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mraxani Label – Artists</title>

<!-- TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Titillium Web', sans-serif;
  background-color: #fdfcf7;
  color: #111;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 20px;
}

/* LOGO */
.logo img {
  height: 100px;
}

/* SOCIAL */
.social {
  display: flex;
  gap: 15px;
}

.social a {
  text-decoration: none;
  font-weight: 700;
  color: #111;
  font-size: 0.9rem;
}

/* SEZIONE ARTISTI */
#artists {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.grid-artists {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1100px;
  width: 100%;
  padding: 0 20px;
}

/* CARD ARTISTA */
.artist-card {
  position: relative;
  overflow: hidden;
}

.artist-card img {
  width: 100%;
  aspect-ratio: 1 / 1; /* QUADRATA */
  object-fit: cover;
  transition: transform 0.3s ease;
}

.artist-card:hover img {
  transform: scale(1.05);
}

/* NOME ARTISTA */
.artist-name {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px 0;
  background: rgba(0,0,0,0.6);
  color: #fff;
  text-align: center;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.artist-card:hover .artist-name {
  opacity: 1;
}

/* LINK */
.artist-card a {
  display: block;
  color: inherit;
  text-decoration: none;
}

/* FOOTER */
footer {
  text-align: center;
  margin-top: 60px;
  padding: 25px 0;
  font-size: 0.9rem;
  color: #777;
  border-top: 1px solid #eee;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img src="images/logo2.png" alt="Mraxani Label">
  </a>
  </div>
</header>

<section id="artists">
  <div class="grid-artists">

    <!-- ARTISTA 1 -->
    <div class="artist-card">
      <a href="claudiomelis.html">
        <img src="images/claudiomelis.png" alt="Claudio Melis">
        <div class="artist-name">Claudio Melis</div>
      </a>
    </div>

    <!-- ARTISTA 2 -->
    <div class="artist-card">
      <a href="eliacasu.html">
        <img src="images/eliacasu.png" alt="Elia Casu">
        <div class="artist-name">Elia Casu</div>
      </a>
    </div>

    <!-- ARTISTA 3 -->
    <div class="artist-card">
      <a href="artist-antoniopinna.html">
        <img src="images/antoniopinna.png" alt="Antonio Pinna">
        <div class="artist-name">Antonio Pinna</div>
      </a>
    </div>

  </div>
</section>

<footer>
  &copy; 2025 Mraxani Label
</footer>

</body>
</html>
