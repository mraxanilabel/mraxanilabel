<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artista - Nome Artista</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* RESET COMPLETO */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: 'Titillium Web', sans-serif;
    background-color: #fdfcf7;
    color: #111;
  }

  /* HEADER LOGO A SINISTRA, POSIZIONE ASSOLUTA */
  header {
    position: absolute; /* esce dal flusso normale */
    top: 0;
    left: 0;
    padding: 5px 20px;
  }

  header a img {
    height: 100px;
    width: auto;
    display: block;
  }

  /* CONTENUTO ARTISTA */
  .artist-container {
    max-width: 700px;
    margin: 0 auto;
    padding-top: 10px; /* piccolo distacco dal bordo superiore */
    text-align: center;
  }

  .artist-container img.artista {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 15px;
  }

  p.bio {
    font-size: 1rem;
    color: #444;
    margin-bottom: 25px;
  }

  /* PLAYER SPOTIFY */
  .spotify-player {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .spotify-player iframe {
    width: 100%;
    height: 380px;
    border: none;
  }
</style>
</head>
<body>

<header>
  <a href="index.html">
    <img src="images/logo2.png" alt="Logo Etichetta">
  </a>
</header>

<div class="artist-container">
  <img src="images/artista1.jpg" alt="Nome Artista" class="artista">
  <h1>Nome Artista</h1>
  <p class="bio">
    Breve descrizione dell’artista. Qui puoi scrivere la sua storia, genere musicale, influenze e curiosità.
  </p>
  <div class="spotify-player">
    <iframe src="https://open.spotify.com/embed/artist/IL_TUO_ARTIST_ID?utm_source=generator" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>
</div>

</body>
</html>
