<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etichetta Discografica</title>

  <!-- FONT TITILLIUM WEB -->
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FONT AWESOME PER ICONE SOCIAL -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: #fdfcf7; /* bianco sporco */
      font-family: 'Titillium Web', sans-serif;
      color: #111;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px;
      background-color: transparent;
    }

    /* LOGO */
    header img {
      height: 100px;
      width: auto;
    }

    /* ICONE SOCIAL */
    .header-social {
      display: flex;
      gap: 12px;
    }

    .header-social a {
      color: #111;       /* icone nere */
      font-size: 1.2rem; /* piccolo */
      text-decoration: none;
      transition: color 0.2s;
    }

    .header-social a:hover {
      color: #555;
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 8px 0;
      background-color: #fdfcf7; /* stesso colore dello sfondo */
      border-bottom: 1px solid #eee;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-weight: 700; /* grassetto */
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #555;
    }

    /* GRIGLIA DISCHI */
    .grid-releases {
      display: grid;
      grid-template-columns: repeat(auto-fit, 360px);
      gap: 24px;
      justify-content: center;
      margin: 40px auto;
    }

    .album {
      text-align: center;
    }

    .album img {
      width: 360px;
      height: 360px;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.25s ease;
    }

    .album img:hover {
      transform: scale(1.05);
    }

    .album-info p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #444;
    }

    .album-info .titolo {
      font-weight: 500;
      border-bottom: 1px dashed #999;
      padding-bottom: 3px;
      margin-bottom: 4px;
    }

    .album-info .genere {
      font-style: italic;
      color: #666;
      border-bottom: 1px dashed #999;
      padding-bottom: 3px;
      margin-bottom: 4px;
    }

    /* PULSANTE PAYPAL */
    .paypal-button {
      margin-top: 8px;
      text-align: center;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 25px 0;
      font-size: 0.9rem;
      color: #777;
      border-top: 1px solid #eee;
      margin-top: 40px;
      background-color: transparent;
    }

    footer a {
      margin: 0 8px;
      color: #111;
      text-decoration: none;
    }

    footer a:hover {
      color: #555;
    }

  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <img src="images/logo2.png" alt="Logo Etichetta">

    <div class="header-social">
      <a href="https://instagram.com/tuoprofilo" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com/tuocanale" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://open.spotify.com/artist/tuoartista" target="_blank"><i class="fab fa-spotify"></i></a>
    </div>
  </header>

  <!-- NAV -->
  <nav>
    <a href="#home">Home</a>
    <a href="#mission">Mission</a>
    <a href="artists.html">Artists</a>
    <a href="demos.html">Demos</a>
    <a href="#contacts">Contacts</a>
  </nav>

  <!-- RELEASES -->
  <section id="releases">
    <div class="grid-releases">
      <!-- DISCO 1 -->
      <div class="album">
        <img src="images/discomatadiau.png" alt="Disco 1">
        <div class="album-info">
          <p class="artista">Artista 1</p>
          <p class="titolo">Disco 1</p>
          <p class="genere">Jazz</p>
          <div class="paypal-button">
            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
              <input type="hidden" name="cmd" value="_s-xclick">
              <input type="hidden" name="hosted_button_id" value="IL_TUO_CODICE_PULSANTE">
              <input type="image" src="https://www.paypalobjects.com/it_IT/IT/i/btn/btn_buynow_LG.gif" border="0" name="submit" alt="Acquista con PayPal">
              <img alt="" border="0" src="https://www.paypalobjects.com/it_IT/i/scr/pixel.gif" width="1" height="1">
            </form>
          </div>
        </div>
      </div>

      <!-- DISCO 2 -->
      <div class="album">
        <img src="images/disco2.png" alt="Disco 2">
        <div class="album-info">
          <p class="artista">Artista 2</p>
          <p class="titolo">Disco 2</p>
          <p class="genere">Rock</p>
          <div class="paypal-button">
            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
              <input type="hidden" name="cmd" value="_s-xclick">
              <input type="hidden" name="hosted_button_id" value="IL_TUO_CODICE_PULSANTE">
              <input type="image" src="https://www.paypalobjects.com/it_IT/IT/i/btn/btn_buynow_LG.gif" border="0" name="submit" alt="Acquista con PayPal">
              <img alt="" border="0" src="https://www.paypalobjects.com/it_IT/i/scr/pixel.gif" width="1" height="1">
            </form>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2025 Mraxani Label | <a href="#">Instagram</a> | <a href="#">Facebook</a>
  </footer>

</body>
</html>
