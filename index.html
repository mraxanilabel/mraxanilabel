<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etichetta Discografica</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { font-family: 'Titillium Web', sans-serif; background: #fff9e6; color:#111; height: 100%; }

/* FLEX LAYOUT PER FOOTER STICKY */
body { display:flex; flex-direction:column; min-height:100vh; }
main { flex:1; }

/* HEADER */
header {
  position: relative;
  height: 120px; /* spazio per logo + navbar */
}

/* LOGO IN ALTO A SINISTRA */
.logo {
  position: absolute;
  top: 10px;
  left: 10px;
}

.logo img {
  height: 60px;
  width: auto;
  display: block;
}

/* NAVBAR SOTTO LOGO */
nav {
  position: absolute;
  top: 80px; /* sotto il logo */
  left: 0;
  right: 0;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:12px 0;
  background-color: transparent;
  z-index:20;
}

nav a {
  text-decoration:none;
  color:#111;
  font-weight:700;
  text-transform:uppercase;
  font-size:0.95rem;
}

nav a:hover { color:#555; }

/* GRIGLIA DISCHI */
.grid-releases {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(360px,1fr));
  gap:24px;
  max-width:1000px;
  margin: 180px auto 40px auto; /* spazio sufficiente sotto navbar */
  justify-items: center;
}

.album { text-align:center; }

/* IMMAGINI HOVER */
.album-image {
  position: relative;
  width:360px;
  height:360px;
  overflow:hidden;
}

.album-image img {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:6px;
  transition: opacity 0.3s ease, transform 0.25s ease;
}

.album-image img.back { opacity:0; }
.album-image:hover img.front { opacity:0; transform: scale(1.05); }
.album-image:hover img.back { opacity:1; transform: scale(1.05); }

/* TESTO SOTTO IL DISCO */
.album-info p { margin-top:6px; font-size:0.7rem; color:#444; }
.album-info .titolo, .album-info .genere { font-weight:500; }

/* BANNER ANIMATO */
.banner {
  background-color: #fff9e6;  
  color: #111;
  font-weight: 500;
  padding: 10px 0;
  text-align:center;
  white-space: nowrap;
  overflow: hidden;
  margin: 20px 0;
  border-radius:4px;
}

.banner span {
  display: inline-block;
  padding-left: 100%;
  animation: scrollBanner 15s linear infinite;
}

@keyframes scrollBanner {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

/* FOOTER */
footer {
  text-align: center;
  padding: 25px 20px;
  font-size: 0.9rem;
  color: #111;
  border-top: 1px solid #eee;
  background-color: #fff9e6;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

footer .social-buttons {
  display: flex;
  gap: 15px;
}

footer .social-buttons a {
  color: #111;
  font-size: 24px;
  transition: transform 0.3s ease, color 0.3s ease;
}

footer .social-buttons a:hover {
  color: #555;
  transform: translateY(-2px);
}

/* ===========================
   MEDIA QUERY PER MOBILE
=========================== */
@media (max-width: 768px) {

  /* LOGO PIÙ PICCOLO */
  .logo img { height:50px; }

  header { height:auto; }

  /* HAMBURGER ICON A DESTRA */
  .hamburger {
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    width:25px;
    height:18px;
    cursor:pointer;
    position:absolute;
    top:15px;
    right:10px;
    z-index:30;
  }
  .hamburger span {
    display:block;
    height:3px;
    width:100%;
    background:#111;
    border-radius:2px;
  }

  /* NAVBAR MOBILE SOTTO HAMBURGER */
  nav {
    position: relative;
    top:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    margin-top:60px; /* spazio sotto header */
  }

  nav a {
    display:none;
    padding:8px 0;
    width:100%;
    text-align:center;
  }
  nav.show a { display:block; }

  /* GRIGLIA DISCHI MOBILE */
  .grid-releases { grid-template-columns: 1fr; margin-top:20px; padding:0 15px; }

  /* CORREZIONE IMMAGINI DOPPIE MOBILE */
  .album-image { position:relative; width:100%; max-width:300px; height:auto; aspect-ratio:1/1; }
  .album-image img { position:relative; width:100%; height:100%; }

  .album-info p { font-size:0.85rem; }
  footer { padding:20px 15px; }
  .banner { font-size:0.85rem; }
}
</style>
</head>
<body>

  </div>

  <!-- HAMBURGER ICON MOBILE -->
  <div class="hamburger" onclick="document.querySelector('nav').classList.toggle('show')">
    <span></span>
    <span></span>
    <span></span>
  </div>
</header>

<!-- NAVBAR -->
<nav>
  <a href="mission.html">Mission</a>
  <a href="artists.html">Artists</a>
  <a href="orders.html">Orders</a>
  <a href="demos.html">Demos</a>
  <a href="contacts.html">Contacts</a>

<!-- RELEASES -->
<main>

  <div class="album">

</div>

</main>

<!-- FOOTER -->
<footer>
  &copy; 2026 Mraxani Label
  <div class="social-buttons">
    <a href="https://www.instagram.com/mraxani.label" target="_blank" title="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.youtube.com/tuocanale" target="_blank" title="Facebook">
      <i class="fab fa-facebook"></i>
    </a>
    <a href="https://open.spotify.com/playlist/0jHYnSIdXn9onC4SRi8L1Y?si=3jF6r8ELSk2JbNs5tbSFug" target="_blank" title="Spotify">
      <i class="fab fa-spotify"></i>
    </a>
  </div>
</footer>

</body>
</html>
