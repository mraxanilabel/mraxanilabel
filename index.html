<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etichetta Discografica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- FONT TITILLIUM WEB -->
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

html, body {
    height: 100%;
    background-color: #fdfcf7; /* bianco sporco */
    margin: 0;
    padding: 0;
}

header {
    text-align: left;   /* allinea tutto a sinistra */
    padding: 10px 20px; /* margine interno laterale */
}

header img {
    display: block;
    margin: 0; /* rimuove il centraggio automatico */
    height: 100px;
    width: auto;
}
<header>
  <div class="header-social">
    <a href="https://instagram.com/tuoprofilo" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://youtube.com/tuocanale" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://open.spotify.com/artist/tuoartista" target="_blank"><i class="fab fa-spotify"></i></a>
  </div>
    /* NAV */
nav {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 8px 0;
    background-color: #fdfcf7; /* stesso bianco sporco del body */
    border-bottom: 1px solid #eee; /* puoi lasciare o cambiare colore del bordo */
    margin-bottom: 0;
}

    nav a {
      text-decoration: none;
      color: #111;
      font-weight: 500;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #555;
    }

    /* GRIGLIA DISCHI */
    .grid-releases {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 40px auto 0 auto;
    }

    .album {
      text-align: center;
    }

    .album img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.25s ease;
    }

    .album img:hover {
      transform: scale(1.05);
    }

    .album p {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #444;
    }

    /* SEZIONE CONTATTI */
    #contatti {
      padding: 30px 20px;
      text-align: center;
    }

    #contatti h2 {
      margin-bottom: 15px;
    }

    #contatti a {
      color: #111;
      text-decoration: none;
      font-weight: 500;
    }

    #contatti a:hover {
      color: #555;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 25px 0;
      font-size: 0.9rem;
      color: #777;
      border-top: 1px solid #eee;
      margin-top: 40px;
    }

    footer a {
      margin: 0 8px;
      color: #111;
      text-decoration: none;
    }

    footer a:hover {
      color: #555;
    }

    .album-info .titolo {
      font-weight: 500;
      position: relative;
      padding-bottom: 4px;   
      margin-bottom: 6px;    
      border-bottom: 1px dashed #999; 
    }

    .album-info .genere {
      font-style: italic;
      color: #666;
      position: relative;
      padding-bottom: 4px;   
      margin-bottom: 6px;    
      border-bottom: 1px dashed #999; 
    }

    .album-info .prezzo {
      font-weight: 500;
      color: #111;
      position: relative;
      padding-bottom: 4px;   
      margin-bottom: 6px;    
      border-bottom: 1px dashed #999; 
    }
  </style>
</head>

</head>
<body>

  <!-- LOGO -->
  <header>
    <img src="images/logo2.png" alt="Logo Etichetta">
  </header>

  <!-- BARRA DI NAV -->
  <nav>
    <a href="#home">Home</a>
    <a href="#mission">Mission</a>
        <a href="artists.html">Artists</a>
        <a href="demos.html">Demos</a>
    <a href="#contacts">Contacts</a>
  </nav>

  <!-- RELEASES -->
  <section id="releases">
    <div class="grid-releases">
  <div class="album">
    <img src="images/disco1.png" alt="Disco 1">
    <div class="album-info">
      <p class="artista">Artista 1</p>
      <p class="titolo">Disco 1</p>
      <p class="genere">Jazz</p>
      <p class="prezzo">€19,99</p>
    </div>
  </div>
  <div class="album">
    <img src="images/disco2.jpg" alt="Disco 2">
    <div class="album-info">
      <p class="artista">Artista 2</p>
      <p class="titolo">Disco 2</p>
      <p class="genere">Rock</p>
      <p class="prezzo">€17,50</p>
    </div>
     </div>
  <div class="album">
    <img src="images/disco3.png" alt="Disco 2">
    <div class="album-info">
      <p class="artista">Artista 2</p>
      <p class="titolo">Disco 2</p>
      <p class="genere">Rock</p>
      <p class="prezzo">€17,50</p>
    </div>
     </div>
      <div class="album">
    <img src="images/disco4.png" alt="Disco 2">
    <div class="album-info">
      <p class="artista">Artista 2</p>
      <p class="titolo">Disco 2</p>
      <p class="genere">Rock</p>
      <p class="prezzo">€17,50</p>
  </div>
    </div>
  </section>


  <!-- FOOTER -->
  <footer>
    &copy; 2025 Mraxani Label | <a href="#">Instagram</a> | <a href="#">Facebook</a>
  </footer>

</body>
</html>
