<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mraxani Label</title>

<!-- TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Titillium Web', sans-serif;
  background-color: #fdfcf7; /* bianco sporco */
  color: #111;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 20px;
}

/* LOGO */
.logo img {
  height: 100px;
}

/* NAV */
nav {
  display: flex;
  gap: 25px;
}

nav a {
  text-decoration: none;
  font-weight: 700;
  color: #111;
  text-transform: uppercase;
  font-size: 0.95rem;
}

/* SOCIAL */
.social {
  display: flex;
  gap: 15px;
}

.social a {
  text-decoration: none;
  font-weight: 700;
  color: #111;
  font-size: 0.9rem;
}

/* SEZIONE DISCHI */
#releases {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.grid-releases {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 30px;
  max-width: 1100px;
  width: 100%;
  padding: 0 20px;
}

/* ALBUM */
.album {
  text-align: center;
}

.album-image {
  width: 360px;
  height: 360px;
  margin: 0 auto;
  position: relative;
}

.album-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
}

/* INFO */
.album-info {
  margin-top: 10px;
}

.album-info p {
  margin: 4px 0;
  font-size: 0.95rem;
}

/* PULSANTE COMPRA */
.buy-button {
  margin-top: 10px;
}

.buy-button a {
  display: inline-block;
  padding: 10px 18px;
  background: #000;
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  border-radius: 4px;
}

.buy-button a:hover {
  background: #333;
}

/* FOOTER */
footer {
  text-align: center;
  margin-top: 60px;
  padding: 25px 0;
  font-size: 0.9rem;
  color: #777;
  border-top: 1px solid #eee;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img src="images/logo2.png" alt="Mraxani Label">
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="artists.html">Artists</a>
    <a href="demos.html">Demos</a>
    <a href="#contacts">Contacts</a>
  </nav>

  <div class="social">
    <a href="#">Instagram</a>
    <a href="#">YouTube</a>
    <a href="#">Spotify</a>
  </div>
</header>

<section id="releases">
  <div class="grid-releases">

    <!-- DISCO 1 -->
    <div class="album">
      <div class="album-image">
        <img src="images/disco1.png" alt="Disco 1">
      </div>
      <div class="album-info">
        <p><strong>Artista 1</strong></p>
        <p>Disco 1</p>
        <p>Jazz</p>
        <div class="buy-button">
          <a href="#">Compra ora</a>
        </div>
      </div>
    </div>

    <!-- DISCO 2 -->
    <div class="album">
      <div class="album-image">
        <img src="images/disco2.png" alt="Disco 2">
      </div>
      <div class="album-info">
        <p><strong>Artista 2</strong></p>
        <p>Disco 2</p>
        <p>Rock</p>
        <div class="buy-button">
          <a href="#">Compra ora</a>
        </div>
      </div>
    </div>

  </div>
</section>

<footer>
  &copy; 2025 Mraxani Label
</footer>

</body>
</html>
