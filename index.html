<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etichetta Discografica</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  font-family:'Titillium Web', sans-serif;
  background:#fff9e6;
  color:#111;
  height:100%;
}

/* LAYOUT */
body {
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
main { flex:1; }

/* HEADER */
header {
  position:absolute;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  z-index:100;
}

header .logo img {
  height: 60px;
  width: auto;
  display: block;
  position: relative;   /* così possiamo usare z-index */
  z-index: 30;          /* superiore al nav che è a 20 */
}

/* NAVBAR DESKTOP */
nav {
  position: fixed;
  top: 50px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:12px 0;
  background-color: rgba(255, 249, 230, 0.95); /* leggermente trasparente ma cliccabile */
  z-index: 999; /* molto più alto */
}

nav a {
  text-decoration:none;
  color:#111;
  font-weight:700;
  text-transform:uppercase;
  font-size:0.95rem;
}

nav a:hover { color:#555; }

/* HAMBURGER */
.hamburger {
  display:none;
  background:none;
  border:none;
  font-size:28px;
  cursor:pointer;
  color:#111;
}

/* GRID RELEASES */
.grid-releases {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(360px,1fr));
  gap:24px;
  max-width:1000px;
  margin:150px auto 40px auto;
  justify-items:center;
}

.album { text-align:center; }

.album-image {
  position:relative;
  width:360px;
  height:360px;
}

.album-image img {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:6px;
  transition:opacity 0.3s ease, transform 0.25s ease;
}

.album-image img.back { opacity:0; }
.album-image:hover img.front { opacity:0; transform:scale(1.05); }
.album-image:hover img.back { opacity:1; transform:scale(1.05); }

.album-info p {
  margin-top:6px;
  font-size:0.7rem;
  color:#444;
}

/* BANNER */
.banner {
  background:#fff9e6;
  color:#111;
  font-weight:500;
  padding:10px 0;
  white-space:nowrap;
  overflow:hidden;
  margin:20px 0;
}

.banner span {
  display:inline-block;
  padding-left:100%;
  animation:scrollBanner 15s linear infinite;
}

@keyframes scrollBanner {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* FOOTER */
footer {
  text-align:center;
  padding:25px 20px;
  font-size:0.9rem;
  border-top:1px solid #eee;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

footer .social-buttons {
  display:flex;
  gap:15px;
}

footer .social-buttons a {
  color:#111;
  font-size:24px;
}

/* ================= MOBILE ================= */
@media (max-width:768px) {

  nav {
    display:none;
    flex-direction:column;
    background:#fff9e6;
    padding:20px 0;
    gap:15px;
    position:absolute;
    top:70px;
    left:0;
    width:100%;
    z-index:100;
  }

  nav.active { display:flex; }

  .hamburger { display:block; }

  .grid-releases {
    grid-template-columns:1fr;
    margin-top:120px;
    padding:0 15px;
  }

  .album-image {
    width:100%;
    max-width:300px;
    height:auto;
    aspect-ratio:1/1;
  }

  .album-image img {
    position:relative;
    width:100%;
    height:100%;
  }
}
</style>
</head>

<body>

<header>
<div class="logo">
  <img src="images/logo2.png" alt="Logo Etichetta">
  </div>
  <button class="hamburger" aria-label="Menu">
    <i class="fas fa-bars"></i>
  </button>
</header>

<nav>
  <a href="mission.html">Mission</a>
  <a href="artists.html">Artists</a>
  <a href="orders.html">Orders</a>
  <a href="demos.html">Demos</a>
  <a href="contacts.html">Contacts</a>
</nav>

<main>
<section class="grid-releases">
  <div class="album">
    <div class="album-image">
      <img class="front" src="images/discomatadiau.png">
      <img class="back" src="images/discomatadiauback.png">
    </div>
    <div class="album-info">
      <h3>MATADIAU</h3>
      <p>ELIA CASU | ANTONIO PINNA</p>
      <p>ML 001</p>
    </div>
  </div>

  <div class="album">
    <div class="album-image">
      <img class="front" src="images/disco2.png">
      <img class="back" src="images/disco2back.png">
    </div>
    <div class="album-info">
      <h3>POEMS FOR SAX</h3>
      <p>CLAUDIO MELIS</p>
      <p>ML 002</p>
    </div>
  </div>
</section>

<div class="banner">
  <span>🔥 NEW RELEASES OUT NOW — FOLLOW US FOR UPDATES 🔥</span>
</div>
</main>

<footer>
  &copy; 2026 Mraxani Label
  <div class="social-buttons">
    <a href="https://www.instagram.com/mraxani.label" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-spotify"></i></a>
  </div>
</footer>

<script>
  const hamburger = document.querySelector('.hamburger');
  const nav = document.querySelector('nav');

  hamburger.addEventListener('click', () => {
    nav.classList.toggle('active');
  });

  // Chiudi il menu quando clicchi su un link
  document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
      nav.classList.remove('active');
    });
  });
</script>

</body>
</html>
