<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etichetta Discografica</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { font-family: 'Titillium Web', sans-serif; background: #fff9e6; color:#111; }

/* HEADER */
header {
  position: absolute;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content: space-between;
  align-items: center;
  padding:20px 20px;
  z-index:10;
}

header .logo img {
  height:100px;
  width:auto;
  display:block;
}

/* NAVBAR TRASPARENTE */
nav {
  position: fixed;
  top: 50px;   /* distanza dal bordo superiore */
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:12px 0;
  background-color: transparent;
  z-index:20;
}

nav a {
  text-decoration:none;
  color:#111;
  font-weight:700;
  text-transform:uppercase;
  font-size:0.95rem;
}

nav a:hover { color:#555; }

/* GRIGLIA DISCHI */
.grid-releases {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(360px,1fr));
  gap:24px;
  max-width:1000px;
  margin: 150px auto 40px auto;
  justify-items: center;
}

.album {
  text-align:center;
}

/* IMMAGINI HOVER */
.album-image {
  position: relative;
  width:360px;
  height:360px;
}

.album-image img {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:6px;
  transition: opacity 0.3s ease, transform 0.25s ease;
}

.album-image img.back { opacity:0; }

.album-image:hover img.front { opacity:0; transform: scale(1.05); }
.album-image:hover img.back { opacity:1; transform: scale(1.05); }

/* TESTO SOTTO IL DISCO */
.album-info {
  width:100%;
  text-align:center;
}

.album-info p {
  margin-top:6px;
  font-size:0.7rem;
  color:#444;
}

.album-info .titolo, .album-info .genere {
  font-weight:500;
}

/* PULSANTI PAYPAL SIMULATI */
.paypal-button {
  margin-top:10px;
}

.paypal-button button {
  background-color:#111;
  color:#fff;
  border:none;
  padding:10px 20px;
  border-radius:4px;
  cursor:pointer;
  font-weight:700;
  transition: background 0.2s;
}

.paypal-button button:hover { background-color:#333; }

footer {
  text-align: center;          /* testo e pulsanti centrati */
  padding: 25px 20px;
  font-size: 0.9rem;
  color: #111;                 /* colore testo */
  border-top: 1px solid #eee;
  background-color: #fff9e6;   /* bianco caldo */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;                   /* spazio tra copyright e pulsanti */
}

footer .social-buttons {
  display: flex;
  gap: 15px;                   /* spazio tra le icone */
}

footer .social-buttons a {
  color: #111;                 /* icone nere */
  font-size: 24px;             /* dimensione icone */
  transition: transform 0.3s ease, color 0.3s ease;
}

footer .social-buttons a:hover {
  color: #555;                 /* leggero scurimento al passaggio del mouse */
  transform: translateY(-2px); /* effetto sollevamento */
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <a href="index.html"><img src="images/logo2.png" alt="Logo Etichetta"></a>
  </div>
</header>

<!-- BARRA DI NAV -->
<nav>
  <a href="mission.html">Mission</a>
  <a href="artists.html">Artists</a>
  <a href="demos.html">Demos</a>
  <a href="contacts.html">Contacts</a>
</nav>

<!-- RELEASES -->
<section id="releases" class="grid-releases">

  <!-- DISCO 1 -->
  <div class="album">
    <div class="album-image">
      <img class="front" src="images/discomatadiau.png" alt="Disco 1">
      <img class="back" src="images/discomatadiauback.png" alt="Disco 1 Retro">
    </div>
    <div class="album-info">
      <p class="artista"><h3>MATADIAU</h3></p>
      <p class="titolo">ELIA CASU | ANTONIO PINNA</p>
      <p class="genere">ML 001</p>
      <div class="paypal-button"><button>Compra ora</button></div>
    </div>
  </div>

  <!-- DISCO 2 -->
  <div class="album">
    <div class="album-image">
      <img class="front" src="images/disco2.png" alt="Disco 2">
      <img class="back" src="images/disco2back.png" alt="Disco 2 Retro">
    </div>
    <div class="album-info">
      <p class="artista"><h3>POEMS FOR SAX</h3></p>
      <p class="titolo">CLAUDIO MELIS</p>
      <p class="genere">ML 002</p>
      <div class="paypal-button"><button>Compra ora</button></div>
    </div>
  </div>

</section>

<!-- FOOTER -->
<footer>
  &copy; 2026 Mraxani Label
  <div class="social-buttons">
    <a href="https://www.instagram.com/tuoaccount" target="_blank" title="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.youtube.com/tuocanale" target="_blank" title="YouTube">
      <i class="fab fa-youtube"></i>
    </a>
    <a href="https://open.spotify.com/artist/tuoartista" target="_blank" title="Spotify">
      <i class="fab fa-spotify"></i>
    </a>
  </div>
</footer>

</body>
</html>
