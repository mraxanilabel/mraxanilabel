<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etichetta Discografica</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<!-- ICONS (lucide) -->
<link href="https://cdn.jsdelivr.net/npm/lucide@0.258.0/dist/lucide.min.css" rel="stylesheet">

<style>
/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { font-family: 'Titillium Web', sans-serif; background: #fdfcf7; color:#111; }

/* HEADER: LOGO */
header {
  position: absolute;
  top:0;
  left:0;
  display:flex;
  align-items: center;
  padding:20px 20px;
  z-index:10;
}

header .logo img {
  height:100px;
  width:auto;
  display:block;
}

/* NAVBAR TRASPARENTE CON SOCIAL INTEGRATI A DESTRA */
nav {
  position: fixed;
  top:50px;   /* distanza dal bordo superiore */
  left:0;
  right:0;
  background-color: transparent;
  z-index:20;
}

nav .nav-container {
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  max-width:1200px;
  margin:0 auto;
}

nav .nav-links {
  display:flex;
  gap:25px;
  flex-grow:1;
  justify-content:center;
}

nav .nav-links a {
  text-decoration:none;
  color:#111;
  font-weight:700;
  text-transform:uppercase;
  font-size:0.95rem;
  transition: color 0.2s;
}

nav .nav-links a:hover { color:#555; }

nav .social-icons {
  display:flex;
  gap:15px;
}

nav .social-icons a {
  color:#111;
  text-decoration:none;
  font-size:1.5rem;
  transition: color 0.2s;
}

nav .social-icons a:hover { color:#555; }

/* GRIGLIA DISCHI */
.grid-releases {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(360px,1fr));
  gap:24px;
  max-width:1000px;
  margin: 120px auto 40px auto; /* più vicina alla barra */
  justify-items: center;
}

.album {
  text-align:center;
}

/* IMMAGINI HOVER */
.album-image {
  position: relative;
  width:360px;
  height:360px;
}

.album-image img {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:6px;
  transition: opacity 0.3s ease, transform 0.25s ease;
}

.album-image img.back { opacity:0; }

.album-image:hover img.front { opacity:0; transform: scale(1.05); }
.album-image:hover img.back { opacity:1; transform: scale(1.05); }

/* TESTO SOTTO IL DISCO */
.album-info {
  width:100%;
  text-align:center;
}

.album-info p {
  margin-top:6px;
  font-size:0.9rem;
  color:#444;
}

.album-info .titolo, .album-info .genere {
  font-weight:500;
}

/* PULSANTI PAYPAL SIMULATI */
.paypal-button {
  margin-top:10px;
}

.paypal-button button {
  background-color:#111;
  color:#fff;
  border:none;
  padding:10px 20px;
  border-radius:4px;
  cursor:pointer;
  font-weight:700;
  transition: background 0.2s;
}

.paypal-button button:hover { background-color:#333; }

/* FOOTER */
footer {
  text-align:center;
  padding:25px 0;
  font-size:0.9rem;
  color:#777;
  border-top:1px solid #eee;
  margin-top:40px;
}

footer a { margin:0 8px; color:#111; text-decoration:none; }
footer a:hover { color:#555; }

</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <a href="index.html"><img src="images/logo2.png" alt="Logo Etichetta"></a>
  </div>
</header>

<!-- BARRA DI NAV CON LINK + SOCIAL -->
<nav style="position: fixed; top:50px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:12px 40px; background-color: rgba(255,255,255,0.95); z-index:50; max-width:1200px; margin:0 auto;">
  
  <!-- LINK PRINCIPALI -->
  <div class="nav-links" style="display:flex; gap:25px;">
    <a href="index.html">Home</a>
    <a href="artists.html">Artists</a>
    <a href="demos.html">Demos</a>
    <a href="#contacts">Contacts</a>
  </div>
  
  <!-- PULSANTI SOCIAL -->
  <div class="social-icons" style="display:flex; gap:15px;">
    <a href="#" target="_blank" title="Instagram"><i class="lucide-instagram"></i></a>
    <a href="#" target="_blank" title="YouTube"><i class="lucide-youtube"></i></a>
    <a href="#" target="_blank" title="Spotify"><i class="lucide-spotify"></i></a>
  </div>

</nav>


<!-- RELEASES -->
<section id="releases" class="grid-releases">

  <!-- DISCO 1 -->
  <div class="album">
    <div class="album-image">
      <img class="front" src="images/discomatadiau.png" alt="Disco 1">
      <img class="back" src="images/discomatadiauback.png" alt="Disco 1 Retro">
    </div>
    <div class="album-info">
      <p class="artista">Artista 1</p>
      <p class="titolo">Disco 1</p>
      <p class="genere">Jazz</p>
      <div class="paypal-button"><button>Compra ora</button></div>
    </div>
  </div>

  <!-- DISCO 2 -->
  <div class="album">
    <div class="album-image">
      <img class="front" src="images/disco2.png" alt="Disco 2">
      <img class="back" src="images/disco2-back.png" alt="Disco 2 Retro">
    </div>
    <div class="album-info">
      <p class="artista">Artista 2</p>
      <p class="titolo">Disco 2</p>
      <p class="genere">Rock</p>
      <div class="paypal-button"><button>Compra ora</button></div>
    </div>
  </div>

</section>

<!-- FOOTER -->
<footer>
  &copy; 2025 Mraxani Label | <a href="#">Instagram</a> | <a href="#">Facebook</a>
</footer>

<!-- NON DIMENTICARE -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.258.0/dist/lucide.min.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
