<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etichetta Discografica</title>

<!-- FONT TITILLIUM WEB -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* RESET COMPLETO */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; margin:0; padding:0; font-family: 'Titillium Web', sans-serif; background-color: #fdfcf7; color: #111; }

  /* LOGO IN ALTO A SINISTRA */
  header {
    position: absolute;
    top: 0;
    left: 0;
    padding: 5px 20px;
    z-index: 10;
  }

  header a img {
    height: 100px;
    width: auto;
    display: block;
  }

  /* BARRA DI NAV TRASPARENTE */
  nav {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 12px 0;
    background-color: rgba(255,255,255,0.8);
    position: relative;
    margin-top: 0;
    z-index: 5;
  }

  nav a {
    text-decoration: none;
    color: #111;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.95rem;
  }

  nav a:hover {
    color: #555;
  }

  /* GRIGLIA DISCHI */
  .grid-releases {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
    max-width: 1000px;
    margin: 140px auto 40px auto; /* spazio per logo + nav */
  }

  .album {
    text-align: center;
  }

  .album img {
    width: 360px;
    height: 360px;
    object-fit: cover;
    border-radius: 6px;
    transition: transform 0.25s ease;
  }

  .album img:hover { transform: scale(1.05); }

  .album-info p {
    margin-top: 8px;
    font-size: 0.9rem;
    color: #444;
  }

  .album-info .titolo, .album-info .genere {
    font-weight: 500;
  }

  /* CONTENITORE PAYPAL */
  .paypal-button {
    margin-top: 10px;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 25px 0;
    font-size: 0.9rem;
    color: #777;
    border-top: 1px solid #eee;
    margin-top: 40px;
  }

  footer a { margin: 0 8px; color: #111; text-decoration: none; }
  footer a:hover { color: #555; }
</style>
</head>
<body>

<!-- LOGO -->
<header>
  <a href="index.html">

  </a>
</header>

<!-- BARRA DI NAV -->
<nav>
  <a href="#home">Home</a>
  <a href="#mission">Mission</a>
  <a href="artists.html">Artists</a>
  <a href="demos.html">Demos</a>
  <a href="#contacts">Contacts</a>
</nav>

<!-- RELEASES -->
<section id="releases" class="grid-releases">

  <!-- DISCO 1 -->
<div class="album">
  <div class="album-image">
    <img class="front" src="images/discomatadiau.png" alt="Disco 1">
    <img class="back" src="images/discomatadiauback.png" alt="Disco 1 Retro">
  </div>
  <div class="album-info">
    <p class="artista">Artista 1</p>
    <p class="titolo">Disco 1</p>
    <p class="genere">Jazz</p>
    <div class="paypal-button" id="paypal-button-container-1"></div>
  </div>
  </div>

  <!-- DISCO 2 -->
  <div class="album">
    <img src="images/disco2.png" alt="Disco 2">
    <div class="album-info">
      <p class="artista">Artista 2</p>
      <p class="titolo">Disco 2</p>
      <p class="genere">Rock</p>
      <div class="paypal-button" id="paypal-button-container-2"></div>
    </div>
  </div>

</section>

<!-- FOOTER -->
<footer>
  &copy; 2025 Mraxani Label | <a href="#">Instagram</a> | <a href="#">Facebook</a>
</footer>
